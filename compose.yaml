services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.front
    container_name: vueJS
    ports:
      - "80:8000"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.back
    container_name: fastAPI
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

    environment:
      DATABASE_URL: ${DATABASE_URL}
      BASE_URL_VALIDACAO: ${BASE_URL_VALIDACAO}
      # Videochamada (Jitsi Meet): servidor onde as salas são abertas
      JITSI_BASE_URL: ${JITSI_BASE_URL:-https://meet.jit.si}
      # Retentativas do envio de e-mail
      VIDEOCHAMADA_TENTATIVAS: ${VIDEOCHAMADA_TENTATIVAS:-3}
      VIDEOCHAMADA_BACKOFF_SEGUNDOS: ${VIDEOCHAMADA_BACKOFF_SEGUNDOS:-2}
      # E-mail ao paciente (SMTP). Para testes locais use o Mailpit abaixo:
      # SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_USAR_TLS=false (ver README_VIDEOCHAMADA.md)
      
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
      SMTP_USAR_TLS: ${SMTP_USAR_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      # SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      # SMTP_PORT: ${SMTP_PORT:-465}
      # SMTP_EMAIL: ${SMTP_EMAIL}
      # SMTP_SENHA_APP: ${SMTP_SENHA_APP}

      # Mercado Pago
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_RETURN_URL: ${MERCADOPAGO_RETURN_URL}

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP falso para testes locais: captura os e-mails sem entregá-los.
  # Caixa de entrada em http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:  
      - "8000:8080"

volumes:
  postgres_data:
