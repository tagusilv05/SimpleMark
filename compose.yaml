services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.front
    container_name: vueJS
    ports:
      - "80:8000"

  backend:
    build:
      context: .
      dockerfile: Dockerfile.back
    container_name: fastAPI
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      migracoes:
        condition: service_completed_successfully
    volumes:
      # Fotos dos profissionais e anexos da Ouvidoria (dados pessoais): fora da imagem
      - uploads_data:/code/uploads

    environment:
      # Usuário restrito do banco (só lê e grava dados; não cria nem altera tabelas)
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY no .env}
      AMBIENTE: ${AMBIENTE:-producao}
      CORS_ORIGENS: ${CORS_ORIGENS:-https://simplemark-frontend.onrender.com,http://localhost,http://127.0.0.1,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      # Administradora inicial (criada só se as três estiverem definidas)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      ADMIN_CPF: ${ADMIN_CPF:-}
      # Senha dos usuários de exemplo do seed (o seed só roda com AMBIENTE=desenvolvimento)
      SEED_SENHA: ${SEED_SENHA:-}
      BASE_URL_VALIDACAO: ${BASE_URL_VALIDACAO}
      # Videochamada (Jitsi Meet): servidor onde as salas são abertas
      JITSI_BASE_URL: ${JITSI_BASE_URL:-https://meet.jit.si}
      # Retentativas do envio de e-mail
      VIDEOCHAMADA_TENTATIVAS: ${VIDEOCHAMADA_TENTATIVAS:-3}
      VIDEOCHAMADA_BACKOFF_SEGUNDOS: ${VIDEOCHAMADA_BACKOFF_SEGUNDOS:-2}
      # Provedor de e-mail: "brevo" (API HTTP, produção) ou "smtp" (Mailpit local).
      # Vazio: usa o Brevo se BREVO_API_KEY estiver definida; senão, o SMTP.
      EMAIL_PROVEDOR: ${EMAIL_PROVEDOR:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      # Remetente validado na conta do Brevo
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-}
      EMAIL_REMETENTE_NOME: ${EMAIL_REMETENTE_NOME:-SimpleMark}
      # E-mail ao paciente (SMTP). Para testes locais use o Mailpit abaixo:
      # SMTP_HOST=mailpit, SMTP_PORT=1025, SMTP_USAR_TLS=false (ver README_VIDEOCHAMADA.md)
      
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USUARIO: ${SMTP_USUARIO:-}
      SMTP_SENHA: ${SMTP_SENHA:-}
      SMTP_REMETENTE: ${SMTP_REMETENTE:-}
      SMTP_USAR_TLS: ${SMTP_USAR_TLS:-true}
      SMTP_SSL: ${SMTP_SSL:-false}
      # Código de confirmação do login:
      SMTP_EMAIL: ${SMTP_EMAIL:-}
      SMTP_SENHA_APP: ${SMTP_SENHA_APP:-}

      # Mercado Pago
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
      MERCADOPAGO_FRONTEND_URL: ${MERCADOPAGO_FRONTEND_URL:-https://simplemark-frontend.onrender.com}

  # Aplica as migrações do Alembic (alembic upgrade head) e termina.
  # Usa o DONO do esquema; o backend só sobe depois que ele termina com sucesso.
  migracoes:
    build:
      context: .
      dockerfile: Dockerfile.back
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Defina MIGRATION_DATABASE_URL no .env}
    restart: "no"

  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Usuário restrito da API, criado por banco/init/01-usuario-app.sh em volume novo
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    # Sem "ports": o banco só é acessível pela rede interna do Compose (host "db").
    # Para acessar do seu computador, use o Adminer (abaixo) ou:
    #   docker compose exec db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./banco/init:/docker-entrypoint-initdb.d:ro
      - ./banco/sql:/banco/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servidor SMTP falso para testes locais: captura os e-mails sem entregá-los.
  # Caixa de entrada em http://localhost:8025
  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      # Só acessível da própria máquina (não da rede)
      - "127.0.0.1:8000:8080"

volumes:
  postgres_data:
  uploads_data:
