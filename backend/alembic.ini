# Configuração do Alembic (migrações versionadas do banco).
# A URL do banco NÃO fica aqui: vem de MIGRATION_DATABASE_URL (ou DATABASE_URL),
# lida em alembic/env.py.
#
# Uso (dentro de backend/):
#   alembic upgrade head                              # aplica as migrações pendentes
#   alembic revision --autogenerate -m "descricao"    # cria uma migração nova (revise o arquivo!)
#   alembic current                                   # mostra a versão do banco

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
